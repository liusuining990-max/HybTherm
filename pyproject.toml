[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatblock-uniformity"
version = "0.1.0"
description = "Thermal model, analysis pipeline and logging tools for checking temperature uniformity of laboratory heating blocks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
logger = ["pyserial>=3.5"]
cad = ["cadquery>=2.4"]
dev = ["pytest>=7", "pyserial>=3.5"]

[project.scripts]
heatblock-log = "heatblock.logger:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
